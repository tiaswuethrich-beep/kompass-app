name: APK bauen

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: APK bauen
        run: ./gradlew --no-daemon assembleRelease
      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk Kompass.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kompass-APK
          path: Kompass.apk
      - name: Als Release veröffentlichen
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" Kompass.apk --title "Kompass $TAG" --notes "Automatisch gebaut aus ${{ github.sha }}. Auf dem Handy Kompass.apk herunterladen und installieren." --latest
