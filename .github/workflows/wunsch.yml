name: Wunsch umsetzen

# Akh schickt aus der App einen Wunsch (Issue mit Label "kompass-wunsch").
# Claude Code setzt ihn um, die App wird gebaut, und nur wenn der Build klappt,
# landet die Änderung auf main und es entsteht eine neue Version.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: wunsch
  cancel-in-progress: false

jobs:
  umsetzen:
    # Nur Wünsche vom Besitzer des Repositorys, nur mit dem richtigen Label.
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      contains(github.event.issue.labels.*.name, 'kompass-wunsch')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      NR: ${{ github.event.issue.number }}
      TITLE: ${{ github.event.issue.title }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Start melden
        run: gh issue comment "$NR" --body "Ich setze den Wunsch jetzt um. Das dauert meist 10 bis 30 Minuten."

      - name: Claude Code setzt den Wunsch um
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 40
            --allowedTools Read,Edit,Write,Glob,Grep,Bash(./gradlew:*)
          prompt: |
            Du arbeitest im Repository der privaten Android-App "Kompass" (Kotlin, Jetpack Compose, Room).
            Lies zuerst README.md, um den Aufbau zu verstehen.

            Setze diesen Wunsch des Nutzers um:
            Titel: ${{ github.event.issue.title }}
            Beschreibung:
            ${{ github.event.issue.body }}

            Regeln:
            - Texte in der App auf Hochdeutsch (Schweizer Schreibweise mit "ss"), per du, kurz und freundlich.
            - Kleinste sinnvolle Änderung. Bestehende Funktionen nicht entfernen, ausser der Wunsch verlangt es.
            - Nichts unter .github/ ändern, app/kompass.jks und die Signatur nicht anfassen.
            - Keine neuen Abhängigkeiten in app/build.gradle.kts, ausser es geht wirklich nicht anders.
            - Room: Bei neuen Tabellen oder Spalten die Datenbankversion erhöhen und eine Migration schreiben, sonst gehen Daten verloren.
            - Keine neuen Netzwerkziele, keine Schlüssel oder Passwörter im Code.
            - KI-Funktionen nur über ch.akh.kompass.ai.Ai (Haiku), nichts im Hintergrund.
            - Prüfe am Ende mit ./gradlew --no-daemon compileReleaseKotlin, dass alles kompiliert, und behebe Fehler.
            - Schreibe zum Schluss 2 bis 5 Sätze auf Deutsch in die Datei wunsch-ergebnis.md: was du geändert hast und wo man es in der App findet.
            Wenn der Wunsch unklar oder zu gross ist, ändere keinen Code und erkläre in wunsch-ergebnis.md, was fehlt.

      - name: Sperrbereiche prüfen
        run: |
          if git diff --name-only | grep -E '^\.github/|kompass\.jks'; then
            echo "Geschützte Dateien geändert, Abbruch."; exit 1
          fi

      - name: App bauen
        id: build
        run: ./gradlew --no-daemon assembleRelease

      - name: Übernehmen und neue Version auslösen
        id: push
        run: |
          RESULT=$(cat wunsch-ergebnis.md 2>/dev/null || echo "Umgesetzt.")
          rm -f wunsch-ergebnis.md
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            gh issue comment "$NR" --body "$RESULT"$'\n\n'"(Keine Code-Änderung.)"
            gh issue close "$NR" --reason "not planned"
            exit 0
          fi
          git config user.name "Kompass Wunsch-Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wunsch #$NR: $TITLE"
          git push origin HEAD:main
          gh workflow run build.yml --ref main
          gh issue comment "$NR" --body "$RESULT"$'\n\n'"Die neue Version wird jetzt gebaut. Kompass zeigt dir in ein paar Minuten \"Update bereit\"."
          gh label create umgesetzt --color 34D399 --force >/dev/null 2>&1 || true
          gh issue edit "$NR" --add-label umgesetzt
          gh issue close "$NR" --reason completed

      - name: Fehlschlag melden
        if: failure()
        run: |
          gh label create fehlgeschlagen --color FF6B6B --force >/dev/null 2>&1 || true
          gh issue edit "$NR" --add-label fehlgeschlagen || true
          gh issue comment "$NR" --body "Das hat nicht geklappt, die App bleibt unverändert. Formuliere den Wunsch etwas genauer oder schick ihn Claude im Projekt. Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
